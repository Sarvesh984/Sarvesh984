<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" fill="none" role="img" aria-labelledby="title description">
<title id="title">Sarvesh Chakravarthy — idea to impact</title><desc id="description">Animated banner about building useful software through learning and projects.</desc>
<defs>
 <linearGradient id="bg" x1="22" y1="10" x2="1100" y2="340" gradientUnits="userSpaceOnUse"><stop stop-color="#101A27"/><stop offset=".55" stop-color="#0B111D"/><stop offset="1" stop-color="#15142A"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1120" y2="350" gradientUnits="userSpaceOnUse"><stop stop-color="#B6F36A" stop-opacity=".55"/><stop offset=".5" stop-color="#48C9D8" stop-opacity=".22"/><stop offset="1" stop-color="#A78BFA" stop-opacity=".5"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C2FF72"/><stop offset="1" stop-color="#52D3D8"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#52D3D8" stop-opacity=".26"/><stop offset="1" stop-color="#52D3D8" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#90A5C3" stroke-opacity=".07"/></pattern>
 <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<style>
.bg{fill:url(#bg)}.edge{stroke:url(#edge)}.grid{fill:url(#grid)}
.kicker{font:700 11px 'Segoe UI',Ubuntu,Arial,sans-serif;letter-spacing:2.5px;fill:#A9ED78}
.title{font:700 38px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#F2F5F8}
.sub{font:500 15px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#A8B5C7}
.chip{fill:#172432;stroke:#344A55}.chiptext{font:700 10px 'Segoe UI',Ubuntu,Arial,sans-serif;letter-spacing:1px;fill:#D6E2E9}
.tag{font:700 10px 'Segoe UI',Ubuntu,Arial,sans-serif;letter-spacing:1.4px;fill:#A9B7C9}
.node{fill:#121E2A;stroke:#405466}.nodeTitle{font:700 12px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#EAF2F2}
.nodeSmall{font:500 9px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#8798AB}
.code{font:600 12px 'Cascadia Code',Consolas,monospace;fill:#D4E7D3}
.path{fill:none;stroke:url(#accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:7 9;animation:route 8s linear infinite}
.dot{fill:#C2FF72;filter:url(#soft);animation:breathe 2.4s ease-in-out infinite}
.orbit{fill:none;stroke:#74879D;stroke-opacity:.18}
.float1{animation:float 5s ease-in-out infinite}.float2{animation:float 5s ease-in-out -1.8s infinite}.float3{animation:float 5s ease-in-out -3.2s infinite}
.cursor{animation:blink 1s steps(2,start) infinite}
.sweep{fill:url(#accent);opacity:0;animation:sweep 8s ease-in-out infinite}
@keyframes route{to{stroke-dashoffset:-128}}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes breathe{50%{opacity:.35}}
@keyframes blink{50%{opacity:0}}
@keyframes sweep{0%,68%,100%{opacity:0;transform:translateX(-340px)}76%{opacity:.08}90%{opacity:.02;transform:translateX(1120px)}}
@media(prefers-reduced-motion:reduce){.path,.dot,.float1,.float2,.float3,.cursor,.sweep{animation:none!important}}
</style>
<rect class="bg" width="1120" height="350" rx="24"/><rect class="grid" x="1" y="1" width="1118" height="348" rx="23"/><rect x=".75" y=".75" width="1118.5" height="348.5" rx="23.25" class="edge"/>
<circle cx="866" cy="176" r="180" fill="url(#glow)"/><path class="orbit" d="M700 178c0-83 68-151 151-151s151 68 151 151-68 151-151 151-151-68-151-151Z"/><path class="orbit" d="M733 178c0-65 53-118 118-118s118 53 118 118-53 118-118 118-118-53-118-118Z"/>
<text class="kicker" x="50" y="55">SARVESH CHAKRAVARTHY  /  IDEA → BUILD → IMPROVE</text>
<text class="title" x="50" y="116">I build useful</text><text class="title" x="50" y="160">digital experiences.</text>
<text class="sub" x="52" y="197">Aspiring software engineer · Web developer</text>
<text class="sub" x="52" y="220">Learning by shipping practical projects.</text>
<rect class="chip" x="50" y="252" width="142" height="32" rx="16"/><circle cx="68" cy="268" r="4" fill="#B6F36A"/><text class="chiptext" x="82" y="272">B.TECH · IT</text>
<rect class="chip" x="202" y="252" width="120" height="32" rx="16"/><circle cx="220" cy="268" r="4" fill="#52D3D8"/><text class="chiptext" x="234" y="272">BASED IN INDIA</text>
<rect class="chip" x="332" y="252" width="185" height="32" rx="16"/><circle cx="350" cy="268" r="4" fill="#A78BFA"/><text class="chiptext" x="364" y="272">OPEN TO OPPORTUNITIES</text>
<g class="float1"><rect class="node" x="667" y="75" width="136" height="66" rx="14"/><text class="tag" x="684" y="98">01  /  PLAN</text><text class="nodeTitle" x="684" y="121">Start with a need</text></g>
<g class="float2"><rect class="node" x="842" y="154" width="153" height="74" rx="14"/><text class="tag" x="860" y="178">02  /  BUILD</text><text class="code" x="860" y="202">const idea =</text><text class="code cursor" x="860" y="218">  useful;</text></g>
<g class="float3"><rect class="node" x="684" y="245" width="148" height="62" rx="14"/><text class="tag" x="702" y="268">03  /  SHIP</text><text class="nodeSmall" x="702" y="289">Then keep improving</text></g>
<path class="path" d="M803 108c41 0 34 70 39 76m0 0c-5 22-11 72-10 79"/>
<circle class="dot" cx="842" cy="176" r="5"/>
<rect class="sweep" x="0" y="0" width="160" height="350" rx="24"/>
</svg>