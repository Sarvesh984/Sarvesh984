<svg xmlns="http://www.w3.org/2000/svg" width="880" height="170" viewBox="0 0 880 170" fill="none" role="img" aria-labelledby="title description">
<title id="title">How I build</title><desc id="description">A calm animated loop: notice a need, build a solution, refine it, then ship and learn.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="880" y2="170" gradientUnits="userSpaceOnUse"><stop stop-color="#101A27"/><stop offset=".6" stop-color="#0B111D"/><stop offset="1" stop-color="#17142A"/></linearGradient><linearGradient id="line" x1="80" y1="0" x2="800" y2="0"><stop stop-color="#B6F36A"/><stop offset=".52" stop-color="#52D3D8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient></defs>
<style>
.bg{fill:url(#bg)}.frame{stroke:#344357;stroke-opacity:.75}.line{stroke:url(#line);stroke-width:2;stroke-dasharray:8 10;animation:flow 7s linear infinite}.ring{fill:#101A27;stroke:#506174;stroke-width:1.5}.core{fill:#B6F36A;animation:pulse 2.5s ease-in-out infinite}.n1{animation:pulse 2.5s ease-in-out infinite}.n2{animation:pulse 2.5s ease-in-out .5s infinite}.n3{animation:pulse 2.5s ease-in-out 1s infinite}.n4{animation:pulse 2.5s ease-in-out 1.5s infinite}.step{font:700 12px 'Segoe UI',Ubuntu,Arial,sans-serif;letter-spacing:1.2px;fill:#EAF2F2}.detail{font:500 10px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#91A2B4}.eyebrow{font:700 9px 'Segoe UI',Ubuntu,Arial,sans-serif;letter-spacing:2px;fill:#A9ED78}
@keyframes flow{to{stroke-dashoffset:-144}}@keyframes pulse{50%{opacity:.42}}
@media(prefers-reduced-motion:reduce){.line,.n1,.n2,.n3,.n4{animation:none!important}}
</style>
<rect class="bg" width="880" height="170" rx="18"/><rect class="frame" x=".75" y=".75" width="878.5" height="168.5" rx="17.25"/>
<text class="eyebrow" x="28" y="29">A SIMPLE BUILD LOOP</text>
<path class="line" d="M111 77H767"/>
<g><circle class="ring n1" cx="111" cy="77" r="17"/><circle class="core" cx="111" cy="77" r="5"/><text class="step" x="111" y="118" text-anchor="middle">NOTICE</text><text class="detail" x="111" y="137" text-anchor="middle">Understand the need</text></g>
<g><circle class="ring n2" cx="330" cy="77" r="17"/><circle class="core" cx="330" cy="77" r="5"/><text class="step" x="330" y="118" text-anchor="middle">BUILD</text><text class="detail" x="330" y="137" text-anchor="middle">Make it useful</text></g>
<g><circle class="ring n3" cx="550" cy="77" r="17"/><circle class="core" cx="550" cy="77" r="5"/><text class="step" x="550" y="118" text-anchor="middle">REFINE</text><text class="detail" x="550" y="137" text-anchor="middle">Improve the details</text></g>
<g><circle class="ring n4" cx="769" cy="77" r="17"/><circle class="core" cx="769" cy="77" r="5"/><text class="step" x="769" y="118" text-anchor="middle">SHIP</text><text class="detail" x="769" y="137" text-anchor="middle">Learn and repeat</text></g>
</svg>