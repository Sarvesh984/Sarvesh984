  <text class="label" x="28" y="163">React</text><rect class="track" x="170" y="149" width="480" height="12" rx="6"/><rect class="bar d3" x="170" y="149" width="480" height="12" rx="6"/>
  <text class="label" x="28" y="199">HTML</text><rect class="track" x="170" y="185" width="480" height="12" rx="6"/><rect class="bar d4" x="170" y="185" width="480" height="12" rx="6"/>
  <text class="label" x="28" y="235">CSS</text><rect class="track" x="170" y="221" width="480" height="12" rx="6"/><rect class="bar d5" x="170" y="221" width="480" height="12" rx="6"/>
  <text class="label" x="28" y="271">Python</text><rect class="track" x="170" y="257" width="480" height="12" rx="6"/><rect class="bar d6" x="170" y="257" width="480" height="12" rx="6"/>
