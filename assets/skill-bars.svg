<svg xmlns="http://www.w3.org/2000/svg" width="720" height="356" viewBox="0 0 720 356" fill="none">
  <defs>
    <linearGradient id="neon" x1="150" y1="0" x2="630" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D9C0"/><stop offset=".52" stop-color="#5267FF"/><stop offset="1" stop-color="#CF5BFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00D9C0"/><stop offset="1" stop-color="#CF5BFF"/>
    </linearGradient>
  </defs>
  <style>
    .bg{fill:#090B1A}.frame{stroke:#26314D}.title{font:700 18px 'Segoe UI',Ubuntu,sans-serif;fill:#EDF6FF}.sub{font:500 11px 'Segoe UI',Ubuntu,sans-serif;fill:#8FA3C7;letter-spacing:.7px}.label{font:600 13px 'Segoe UI',Ubuntu,sans-serif;fill:#D8E4F4}.track{fill:#18223A}.bar{fill:url(#neon);transform-box:fill-box;transform-origin:left center;animation:grow 3.8s cubic-bezier(.2,.8,.2,1) infinite}.glow{fill:#00D9C0;animation:pulse 1.8s ease-in-out infinite}.d2{animation-delay:.12s}.d3{animation-delay:.24s}.d4{animation-delay:.36s}.d5{animation-delay:.48s}.d6{animation-delay:.6s}.d7{animation-delay:.72s}.d8{animation-delay:.84s}
    @keyframes grow{0%{transform:scaleX(.08);opacity:.45}45%,82%{transform:scaleX(1);opacity:1}100%{transform:scaleX(.08);opacity:.45}}
    @keyframes pulse{50%{opacity:.25}}
  </style>
  <rect class="bg" width="720" height="356" rx="16"/>
  <rect class="frame" x="1" y="1" width="718" height="354" rx="15"/>
