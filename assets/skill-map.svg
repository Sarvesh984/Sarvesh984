<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="640" viewBox="0 0 820 640" fill="none" role="img" aria-labelledby="title description">
<title id="title">Sarvesh's animated project-linked skill map</title>
<desc id="description">Self-rated skill levels and the projects or certificate where each skill is applied.</desc>
<defs>
 <linearGradient id="panel" x1="15" y1="0" x2="810" y2="640" gradientUnits="userSpaceOnUse"><stop stop-color="#10192B"/><stop offset=".58" stop-color="#0B1220"/><stop offset="1" stop-color="#17112C"/></linearGradient>
 <linearGradient id="stroke" x1="0" y1="0" x2="820" y2="640" gradientUnits="userSpaceOnUse"><stop stop-color="#39D9FF" stop-opacity=".48"/><stop offset=".55" stop-color="#7C75FF" stop-opacity=".2"/><stop offset="1" stop-color="#D76BFF" stop-opacity=".38"/></linearGradient>
 <linearGradient id="bar" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#39D9FF"/><stop offset=".52" stop-color="#7287FF"/><stop offset="1" stop-color="#D76BFF"/></linearGradient>
 <linearGradient id="sweep"><stop stop-color="#FFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFF" stop-opacity=".11"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient>
 <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.panel{fill:url(#panel)}.frame{stroke:url(#stroke)}
.eyebrow{font:700 10px 'Segoe UI',Ubuntu,Arial,sans-serif;letter-spacing:2px;fill:#79E7F5}
.title{font:700 23px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#F4F7FF}
.subtitle{font:500 11px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#91A2BF}
.metric{font:700 10px 'Segoe UI',Ubuntu,Arial,sans-serif;letter-spacing:1px;fill:#D9DFFF}
.name{font:650 12px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#EAF1FF}
.meta{font:500 9px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#8393AE}
.pct{font:700 11px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#B6A9FF}
.mark{font:700 8px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#BDEFFF}
.track{fill:#202B40}
.tile{fill:#101A2A;stroke:#293750}
.fill{fill:url(#bar);transform-box:fill-box;transform-origin:left;animation:fill-in 1.3s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--delay)}
.halo{fill:#53E0D1;filter:url(#glow);animation:breathe 2.8s ease-in-out infinite}
.sweep{fill:url(#sweep);opacity:0;animation:soft-sweep 7s ease-in-out 1.5s infinite}
@keyframes fill-in{from{transform:scaleX(.02);opacity:.25}to{transform:scaleX(var(--level));opacity:1}}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes soft-sweep{0%,60%,100%{opacity:0;transform:translateX(-240px)}68%{opacity:.8}82%{opacity:.12;transform:translateX(850px)}}
@media(prefers-reduced-motion:reduce){.fill,.halo,.sweep{animation:none!important}.fill{transform:scaleX(.8);opacity:1}}
</style>
