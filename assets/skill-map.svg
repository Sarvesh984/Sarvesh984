<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Sarvesh's animated skills map</title>
  <desc id="description">Self-rated skill levels and the projects or certificate where each skill is applied.</desc>
  <defs>
    <linearGradient id="panel" x1="26" y1="10" x2="870" y2="455" gradientUnits="userSpaceOnUse"><stop stop-color="#10192B"/><stop offset=".58" stop-color="#0B1220"/><stop offset="1" stop-color="#17112C"/></linearGradient>
    <linearGradient id="stroke" x1="24" y1="0" x2="876" y2="470" gradientUnits="userSpaceOnUse"><stop stop-color="#39D9FF" stop-opacity=".48"/><stop offset=".52" stop-color="#7C75FF" stop-opacity=".22"/><stop offset="1" stop-color="#D76BFF" stop-opacity=".4"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="318" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#39D9FF"/><stop offset=".52" stop-color="#7287FF"/><stop offset="1" stop-color="#D76BFF"/></linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".13"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .panel{fill:url(#panel)} .frame{stroke:url(#stroke)}
    .eyebrow{font:700 10px 'Segoe UI',Ubuntu,Arial,sans-serif;letter-spacing:2px;fill:#79E7F5}
    .title{font:700 23px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#F4F7FF}
    .subtitle{font:500 11px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#91A2BF}
    .metric{font:700 10px 'Segoe UI',Ubuntu,Arial,sans-serif;letter-spacing:1px;fill:#D9DFFF}
    .name{font:650 12px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#EAF1FF}
    .meta{font:500 9px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#8393AE}
    .pct{font:700 11px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#B6A9FF}
    .mark{font:700 8px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#BDEFFF}
    .track{fill:#202B40}
    .fill{fill:url(#bar);transform-box:fill-box;transform-origin:left;transform:scaleX(var(--level));animation:fill-in 1.35s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--delay)}
    .tile{fill:#101A2A;stroke:#293750}
    .halo{fill:#53E0D1;filter:url(#shadow);animation:breathe 2.8s ease-in-out infinite}
    .orbit{fill:none;stroke:#6D7DFF;stroke-opacity:.12;stroke-width:1}
    .sweep{fill:url(#sweep);opacity:0;animation:soft-sweep 7s ease-in-out 1.4s infinite}
    @keyframes fill-in{from{transform:scaleX(.02);opacity:.3}to{transform:scaleX(var(--level));opacity:1}}
    @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes soft-sweep{0%,60%,100%{opacity:0;transform:translateX(-220px)}68%{opacity:.85}82%{opacity:.18;transform:translateX(930px)}}
    @media(prefers-reduced-motion:reduce){.fill,.halo,.sweep{animation:none!important}.fill{transform:scaleX(var(--level));opacity:1}}
  </style>
  <rect class="panel" width="900" height="470" rx="22"/><rect class="frame" x=".75" y=".75" width="898.5" height="468.5" rx="21.25"/>
  <circle class="orbit" cx="829" cy="64" r="48"/><circle class="orbit" cx="829" cy="64" r="62"/><circle class="halo" cx="829" cy="64" r="3.5"/>
