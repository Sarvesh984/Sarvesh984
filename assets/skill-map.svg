<title id="title">Sarvesh's project-connected skills</title><desc id="description">Thirteen self-rated skills and how they connect to public projects, a certificate, or current toolkit.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="880" y2="610" gradientUnits="userSpaceOnUse"><stop stop-color="#101A27"/><stop offset=".58" stop-color="#0B111D"/><stop offset="1" stop-color="#17142A"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="880" y2="610" gradientUnits="userSpaceOnUse"><stop stop-color="#B6F36A" stop-opacity=".48"/><stop offset=".5" stop-color="#52D3D8" stop-opacity=".22"/><stop offset="1" stop-color="#A78BFA" stop-opacity=".4"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="350" y2="0"><stop stop-color="#B6F36A"/><stop offset=".52" stop-color="#52D3D8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
.bg{fill:url(#bg)}.edge{stroke:url(#edge)}.eyebrow{font:700 10px 'Segoe UI',Ubuntu,Arial,sans-serif;letter-spacing:2px;fill:#A9ED78}.title{font:700 23px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#F2F5F8}.sub{font:500 11px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#93A2B5}.pill{fill:#192735;stroke:#3D514E}.pilltext{font:700 9px 'Segoe UI',Ubuntu,Arial,sans-serif;letter-spacing:1px;fill:#D9E8D0}.row{fill:#101A27;stroke:#2A394A}.name{font:650 12px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#EAF2F2}.meta{font:500 8px 'Segoe UI',Ubuntu,Arial,sans-serif;letter-spacing:.7px;fill:#8395A8}.mark{font:700 8px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#D7F3B9}.track{fill:#263342}.fill{fill:url(#bar);transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--delay)}.spark{fill:#D9FF9D;filter:url(#glow);animation:blink 2.6s ease-in-out infinite}.sweep{fill:url(#bar);opacity:0;animation:sweep 8s ease-in-out 1s infinite}
@keyframes grow{from{transform:scaleX(.01);opacity:.3}to{transform:scaleX(.8);opacity:1}}@keyframes blink{50%{opacity:.38}}@keyframes sweep{0%,65%,100%{opacity:0;transform:translateX(-250px)}73%{opacity:.05}90%{opacity:.02;transform:translateX(900px)}}
@media(prefers-reduced-motion:reduce){.fill,.spark,.sweep{animation:none!important}.fill{transform:scaleX(.8);opacity:1}}
</style>
