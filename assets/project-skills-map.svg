<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="850" height="490" viewBox="0 0 850 490" fill="none" role="img" aria-labelledby="title description">
<title id="title">Sarvesh's project and skill map</title><desc id="description">Shows which technologies are used in each of Sarvesh's four public projects, plus SQL and Flutter context.</desc>
<defs><linearGradient id="paper" x1="0" y1="0" x2="850" y2="490"><stop stop-color="#FFF9EF"/><stop offset="1" stop-color="#F1E9D9"/></linearGradient><linearGradient id="route" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F26D57"/><stop offset=".5" stop-color="#816BDD"/><stop offset="1" stop-color="#78A277"/></linearGradient></defs>
<style>
.paper{fill:url(#paper)}.frame{stroke:#D9CEBC}.eyebrow{font:700 9px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#756A87}.title{font:700 22px 'Segoe UI',Arial,sans-serif;fill:#27243B}.sub{font:500 10px 'Segoe UI',Arial,sans-serif;fill:#625D6E}.card{fill:#FFFCF6;stroke:#DED4C5}.proj{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#302D41}.type{font:700 7px 'Segoe UI',Arial,sans-serif;letter-spacing:1px;fill:#887F8F}.num{font:700 9px 'Segoe UI',Arial,sans-serif;fill:#645A73}.chiptext{font:700 7px 'Segoe UI',Arial,sans-serif;letter-spacing:.3px;fill:#514B5D}.route{stroke:url(#route);stroke-width:2;stroke-dasharray:4 7;animation:travel 7s linear infinite}.node{fill:#F26D57;stroke:#FFF9EF;stroke-width:2;animation:glow 2.5s ease-in-out infinite}.lane{animation:appear .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--delay)}.foot{font:600 9px 'Segoe UI',Arial,sans-serif;fill:#605B69}.footpill{fill:#FFFDF8;stroke:#D8CCB6}
@keyframes travel{to{stroke-dashoffset:-88}}@keyframes glow{50%{opacity:.35}}@keyframes appear{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){.route,.node,.lane{animation:none!important}}
</style>
<rect class="paper" width="850" height="490" rx="22"/><rect x=".75" y=".75" width="848.5" height="488.5" rx="21.25" class="frame"/>
<text class="eyebrow" x="26" y="34">PROJECTS ARE THE CONTEXT</text><text class="title" x="26" y="65">Skills in the work</text><text class="sub" x="26" y="83">Follow the route from each project to the tools used to build it.</text>
